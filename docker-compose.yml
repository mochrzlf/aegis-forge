version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${APP_NAME:-baseline}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_NAME:-baseline}_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: ${APP_NAME:-baseline}_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Mailpit: Local SMTP Server Mailpit: Local SMTP Server & Webmail untuk testing OTP/Email tanpa spamming email asli Webmail for testing OTP/Emails without spamming real email accounts
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${APP_NAME:-baseline}_mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # Port SMTP lokal
      - '8025:8025' # Web UI: http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500

  # Prism: Instant Mock API Server from docs/openapi.yaml for Mobile Prism: Mock API Server instan dari docs/openapi.yaml untuk pengujian Mobile & Frontend Frontend testing
  prism:
    image: stoplight/prism:5
    container_name: ${APP_NAME:-baseline}_mock_api
    restart: unless-stopped
    ports:
      - '4010:4010'
    volumes:
      - ./docs/openapi.yaml:/api/openapi.yaml:ro
    command: mock -h 0.0.0.0 /api/openapi.yaml

volumes:
  pgdata:
  redisdata:
