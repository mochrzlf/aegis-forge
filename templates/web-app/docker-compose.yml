services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Healthcheck lets `docker compose up -d --wait` (used by CI) block until
    # uvicorn is actually serving — without it, --wait returns once db/cache
    # are healthy while the API is still booting/migrating (connection reset).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;\ntry:\n urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=3)\nexcept Exception:\n sys.exit(1)"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 15s

volumes:
  db_data:
  cache_data:
