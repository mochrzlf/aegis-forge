name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Security & SAST Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: returntocorp/semgrep-action is archived. Semgrep now runs
      # directly via the official CLI container and emits SARIF so findings
      # appear in the GitHub Security tab alongside Trivy results.
      - name: Semgrep SAST Scan (OWASP Top 10, SARIF Output)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Semgrep
        # NOTE: Semgrep exits non-zero whenever it finds any issue, which would
        # mark this step failed and SKIP the following Trivy step (so no
        # trivy-results.sarif is produced). This is a starter template whose
        # sample code may legitimately contain findings, so we report every
        # finding to the Security tab WITHOUT failing CI: we drop the --error
        # flag and append `|| true` so the scan always succeeds and Trivy still
        # runs. Downstream projects wanting a hard SAST gate can remove
        # `|| true` and re-add `--error`.
        run: |
          pipx run semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --sarif --sarif-output=semgrep-results.sarif \
            --metrics=off || true

      - name: Upload Semgrep Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        # Guard on the SARIF file existing so a Semgrep hiccup doesn't fail CI.
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # Pinned to a release tag instead of @master for supply-chain safety
      # (Dependabot will propose version bumps automatically). NOTE: tags use
      # the "v" prefix (e.g. v0.36.0) since the project's tag migration.
      - name: Trivy Vulnerability Scan (SARIF Output)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # exit-code '0' makes Trivy report findings WITHOUT failing the step.
          # This is a starter template: its example dependency manifests may
          # legitimately carry CVEs, and we still want every finding surfaced
          # in the GitHub Security tab rather than a red CI run. Downstream
          # projects that want a hard gate can set this to '1'.
          exit-code: '0'

      - name: Upload Trivy Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        # Guard on the SARIF file existing so a Trivy hiccup doesn't fail CI.
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  contract-validation:
    name: API Contract & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # Lint the OpenAPI contract so a broken spec fails before any
      # backend/mobile code is written against it. We invoke the Redocly CLI
      # directly via npx (pinned) instead of a third-party GitHub Action,
      # because the Redocly/redocly-cli-action repo is no longer resolvable
      # and running the CLI removes that external dependency (same approach
      # we took for Semgrep after its action was archived).
      - name: Setup Node.js (for Redocly CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate OpenAPI Specification (Redocly CLI)
        run: npx --yes @redocly/cli@^1 lint docs/openapi.yaml

      # Parse-check the PostgreSQL schema inside a real Postgres container
      # so syntax/DDL errors surface in CI instead of at first `make up`.
      - name: Validate PostgreSQL Schema (docs/schema.sql)
        run: |
          docker run -d --name pg-schema-check \
            -e POSTGRES_PASSWORD=ci_check \
            postgres:16-alpine

          # Wait until Postgres actually accepts a real connection. `pg_isready`
          # can report "accepting connections" one beat before the Unix socket
          # is fully up, which raced the psql call below and intermittently
          # failed CI with "No such file or directory". We require pg_isready
          # to exit 0 AND keep retrying the psql run itself.
          for i in $(seq 1 30); do
            if docker exec pg-schema-check pg_isready -U postgres -q; then
              break
            fi
            sleep 1
          done

          docker cp docs/schema.sql pg-schema-check:/tmp/schema.sql

          # Retry the schema apply a few times to ride out any remaining
          # startup race, failing only if it still can't connect after retries.
          for i in $(seq 1 10); do
            if docker exec -e PGPASSWORD=ci_check pg-schema-check \
                psql -U postgres -v ON_ERROR_STOP=1 -f /tmp/schema.sql; then
              break
            fi
            echo "psql attempt $i failed; retrying in 2s..."
            sleep 2
            if [ "$i" -eq 10 ]; then
              docker rm -f pg-schema-check
              exit 1
            fi
          done

          docker rm -f pg-schema-check

  dependency-review:
    name: Dependency Review (PR Gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # Blocks PRs that introduce dependencies with known vulnerabilities
      # or non-compliant licenses before they reach main.
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    # Scorecard analyzes the repo's security posture (branch protection,
    # dependency pinning, token permissions, etc.). Most meaningful on the
    # default branch; results upload to the GitHub Security tab.
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.2
        with:
          # The action needs a token to call the GitHub API for checks such as
          # Branch-Protection and Maintained. Without repo_token it can exit
          # silently (run for ~1s) and never write the SARIF file, which then
          # breaks the upload step with "Path does not exist".
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          results_file: scorecard-results.sarif
          results_format: sarif
          # publish_results pushes to the OpenSSF REST API, which requires the
          # repo to be enrolled and can fail on new/private repos. Keep it off
          # and rely on the SARIF upload below so results still land in the
          # GitHub Security tab without an external dependency.
          publish_results: false

      - name: Upload Scorecard Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        # Only attempt the upload when the SARIF file was actually produced,
        # so a Scorecard hiccup doesn't turn the whole job red.
        if: always() && hashFiles('scorecard-results.sarif') != ''
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard

  sbom:
    name: Generate SBOM (Supply Chain)
    runs-on: ubuntu-latest
    # Produces a Software Bill of Materials so consumers can audit exactly
    # what the baseline ships. Uploaded as a build artifact.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Generate SBOM (Anchore Syft, SPDX)
        uses: anchore/sbom-action@v0.20.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30
