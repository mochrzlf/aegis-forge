<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Background Rect with Grid -->
  <rect width="1200" height="520" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="520" rx="16" fill="url(#grid)"/>

  <!-- Top Decorative Ambient Glow -->
  <circle cx="200" cy="50" r="140" fill="#0284c7" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="50" r="140" fill="#a855f7" opacity="0.08" filter="url(#glow)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="65" y="16" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">QUICKSTART FLOW</text>
    
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="-0.5">
      7-Step Development Journey <tspan fill="url(#headerGrad)">(Idea to Production)</tspan>
    </text>
    <text x="0" y="72" fill="#94a3b8" font-size="13">
      Zero guesswork workflow — how beginners and AI coding agents collaborate securely from day one.
    </text>
  </g>

  <!-- ==================== CONNECTING PATHS (Background Layer) ==================== -->
  <!-- Row 1: Step 1 -> Step 2 -> Step 3 -> Step 4 -->
  <path d="M 285 200 L 335 200" stroke="#334155" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)" fill="none"/>
  <path d="M 570 200 L 620 200" stroke="#334155" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)" fill="none"/>
  <path d="M 855 200 L 905 200" stroke="#334155" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)" fill="none"/>

  <!-- U-Turn from Step 4 down to Step 5 -->
  <path d="M 1025 270 C 1025 340, 930 340, 930 350" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow-purple)" fill="none" opacity="0.8"/>

  <!-- Row 2: Step 5 -> Step 6 -> Step 7 -->
  <path d="M 720 420 L 670 420" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow-emerald)" fill="none" opacity="0.8"/>
  <path d="M 435 420 L 385 420" stroke="#334155" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)" fill="none"/>

  <!-- ==================== ROW 1 CARDS ==================== -->

  <!-- CARD 1: Clone Template -->
  <g transform="translate(60, 130)">
    <rect width="225" height="140" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="225" height="4" rx="2" fill="url(#cyanGrad)"/>
    
    <!-- Badge -->
    <rect x="14" y="16" width="60" height="20" rx="10" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="0.8"/>
    <text x="44" y="30" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">STEP 01</text>
    
    <!-- Icon Circle -->
    <circle cx="195" cy="26" r="14" fill="#1e293b"/>
    <text x="195" y="31" font-size="14" text-anchor="middle">📦</text>

    <!-- Title & Desc -->
    <text x="14" y="62" fill="#f1f5f9" font-size="15" font-weight="700">Clone Baseline</text>
    <text x="14" y="82" fill="#94a3b8" font-size="12">Get fresh foundation via</text>
    <text x="14" y="98" fill="#38bdf8" font-size="11" font-family="monospace">git clone &amp; VS Code</text>
    <text x="14" y="118" fill="#64748b" font-size="11">Dev Container supported</text>
  </g>

  <!-- CARD 2: Run Setup Wizard -->
  <g transform="translate(345, 130)">
    <rect width="225" height="140" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="225" height="4" rx="2" fill="url(#cyanGrad)"/>
    
    <!-- Badge -->
    <rect x="14" y="16" width="60" height="20" rx="10" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="0.8"/>
    <text x="44" y="30" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">STEP 02</text>
    
    <!-- Icon Circle -->
    <circle cx="195" cy="26" r="14" fill="#1e293b"/>
    <text x="195" y="31" font-size="14" text-anchor="middle">🧙‍♂️</text>

    <!-- Title & Desc -->
    <text x="14" y="62" fill="#f1f5f9" font-size="15" font-weight="700">Run Setup Wizard</text>
    <text x="14" y="82" fill="#94a3b8" font-size="12">Interactive project init</text>
    <text x="14" y="98" fill="#38bdf8" font-size="11" font-family="monospace">init-new-project.sh</text>
    <text x="14" y="118" fill="#64748b" font-size="11">Auto skeleton &amp; .env keys</text>
  </g>

  <!-- CARD 3: Prompt & PRD Interview -->
  <g transform="translate(630, 130)">
    <rect width="225" height="140" rx="14" fill="#0f172a" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="225" height="4" rx="2" fill="url(#purpleGrad)"/>
    
    <!-- Badge -->
    <rect x="14" y="16" width="60" height="20" rx="10" fill="#581c87" fill-opacity="0.4" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="44" y="30" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">STEP 03</text>
    
    <!-- Icon Circle -->
    <circle cx="195" cy="26" r="14" fill="#1e293b"/>
    <text x="195" y="31" font-size="14" text-anchor="middle">🎙️</text>

    <!-- Title & Desc -->
    <text x="14" y="62" fill="#f1f5f9" font-size="15" font-weight="700">Prompt &amp; PRD Interview</text>
    <text x="14" y="82" fill="#94a3b8" font-size="12">Describe app in prompt file</text>
    <text x="14" y="98" fill="#c084fc" font-size="11" font-family="monospace">AI-AGENT-PROMPT.md</text>
    <text x="14" y="118" fill="#64748b" font-size="11">AI interviews for PRD &amp; UI</text>
  </g>

  <!-- CARD 4: Break Tasks -->
  <g transform="translate(915, 130)">
    <rect width="225" height="140" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="225" height="4" rx="2" fill="url(#purpleGrad)"/>
    
    <!-- Badge -->
    <rect x="14" y="16" width="60" height="20" rx="10" fill="#581c87" fill-opacity="0.4" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="44" y="30" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">STEP 04</text>
    
    <!-- Icon Circle -->
    <circle cx="195" cy="26" r="14" fill="#1e293b"/>
    <text x="195" y="31" font-size="14" text-anchor="middle">📋</text>

    <!-- Title & Desc -->
    <text x="14" y="62" fill="#f1f5f9" font-size="15" font-weight="700">Break into Tasks</text>
    <text x="14" y="82" fill="#94a3b8" font-size="12">Turn PRD into small tasks</text>
    <text x="14" y="98" fill="#c084fc" font-size="11" font-family="monospace">docs/TASKS.md</text>
    <text x="14" y="118" fill="#64748b" font-size="11">With skeleton_hint paths</text>
  </g>

  <!-- ==================== ROW 2 CARDS (Right to Left) ==================== -->

  <!-- CARD 5: Start Stack -->
  <g transform="translate(730, 350)">
    <rect width="245" height="140" rx="14" fill="#0f172a" stroke="#047857" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="245" height="4" rx="2" fill="url(#emeraldGrad)"/>
    
    <!-- Badge -->
    <rect x="14" y="16" width="60" height="20" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8"/>
    <text x="44" y="30" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">STEP 05</text>
    
    <!-- Icon Circle -->
    <circle cx="215" cy="26" r="14" fill="#1e293b"/>
    <text x="215" y="31" font-size="14" text-anchor="middle">🚀</text>

    <!-- Title & Desc -->
    <text x="14" y="62" fill="#f1f5f9" font-size="15" font-weight="700">Launch Stack</text>
    <text x="14" y="82" fill="#94a3b8" font-size="12">Run containers &amp; migrations</text>
    <text x="14" y="98" fill="#34d399" font-size="11" font-family="monospace">make first-run</text>
    <text x="14" y="118" fill="#64748b" font-size="11">Live at http://localhost:8000</text>
  </g>

  <!-- CARD 6: Build Features with AI -->
  <g transform="translate(445, 350)">
    <rect width="215" height="140" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="215" height="4" rx="2" fill="url(#emeraldGrad)"/>
    
    <!-- Badge -->
    <rect x="14" y="16" width="60" height="20" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8"/>
    <text x="44" y="30" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">STEP 06</text>
    
    <!-- Icon Circle -->
    <circle cx="185" cy="26" r="14" fill="#1e293b"/>
    <text x="185" y="31" font-size="14" text-anchor="middle">💻</text>

    <!-- Title & Desc -->
    <text x="14" y="62" fill="#f1f5f9" font-size="15" font-weight="700">Build with AI</text>
    <text x="14" y="82" fill="#94a3b8" font-size="12">Execute tasks 1-by-1</text>
    <text x="14" y="98" fill="#34d399" font-size="11" font-family="monospace">Edit skeleton code</text>
    <text x="14" y="118" fill="#64748b" font-size="11">AI follows AGENTS.md rules</text>
  </g>

  <!-- CARD 7: Audit & Save -->
  <g transform="translate(160, 350)">
    <rect width="215" height="140" rx="14" fill="#0f172a" stroke="#b45309" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="215" height="4" rx="2" fill="url(#amberGrad)"/>
    
    <!-- Badge -->
    <rect x="14" y="16" width="60" height="20" rx="10" fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="0.8"/>
    <text x="44" y="30" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">STEP 07</text>
    
    <!-- Icon Circle -->
    <circle cx="185" cy="26" r="14" fill="#1e293b"/>
    <text x="185" y="31" font-size="14" text-anchor="middle">🛡️</text>

    <!-- Title & Desc -->
    <text x="14" y="62" fill="#f1f5f9" font-size="15" font-weight="700">Audit &amp; Commit</text>
    <text x="14" y="82" fill="#94a3b8" font-size="12">Verify security &amp; save</text>
    <text x="14" y="98" fill="#fbbf24" font-size="11" font-family="monospace">make audit &amp;&amp; git commit</text>
    <text x="14" y="118" fill="#64748b" font-size="11">Protected by Gitleaks hook</text>
  </g>
</svg>
