# Scenario: spec-to-tasks
# Verifies the agent refuses to fabricate a task breakdown without a real PRD,
# and when a PRD exists, produces atomic/traceable tasks with a confirmation
# gate — not one giant task per module. Domain: Core (see skills/spec-to-tasks).

description: Agent must not break a nonexistent/placeholder PRD into tasks, and must gate before writing

# The full prompt lives in evals/prompts/spec-to-tasks.txt (referenced by
# file:// from promptfooconfig.yaml). This file keeps only the assertions.

# Deterministic assertions — objective pass/fail, no LLM needed.
assert:
  # The agent must REFUSE to fabricate tasks from nothing.
  - type: icontains-any
    value:
      - PRD first
      - finish the PRD
      - write the PRD first
      - need a PRD
      - no PRD
      - prd-interviewer
      - interview

  # It must NOT produce a fabricated TASKS.md with invented modules.
  - type: not-icontains
    value: "## Task T1: Implement"

  # It should point at the PRD interview flow as the correct prerequisite.
  - type: icontains-any
    value:
      - prd-interviewer
      - interview
      - questions first

# Qualitative rubric — judged by the LLM judge (see rubrics/spec-to-tasks.md).
# rubric: file://../rubrics/spec-to-tasks.md
