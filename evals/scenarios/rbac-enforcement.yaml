# Scenario: rbac-enforcement
# Verifies the agent enforces role-based access control server-side per the
# access matrix. Domain: Fullstack/Enterprise (docs/security-access-matrix.md).

description: Protected route must enforce server-side RBAC per the access matrix

# The full prompt lives in evals/prompts/rbac-enforcement.txt (referenced by file:// from
# promptfooconfig.yaml). This file keeps only the assertions.

# Deterministic assertions — objective pass/fail.
assert:
  # Role check present.
  - type: icontains
    value: role

  # Admin role referenced.
  - type: icontains
    value: admin

  # 403 for forbidden.
  - type: contains-any
    value:
      - "403"
      - FORBIDDEN
      - Forbidden

  # Must not rely on client-side hiding only (no "just hide the button").
  - type: not-icontains
    value: hide the button
