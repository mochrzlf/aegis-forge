# promptfoo configuration — Aegis Forge agent evals
# Docs: https://promptfoo.dev  (MIT — see docs/research/EXTERNAL-TOOLS.md §4)
#
# This file is a REFERENCE + run-instructions. The runnable configs are the
# per-scenario files in evals/suites/. To run:
#   npx promptfoo@latest eval -c evals/suites/<name>.yaml --no-cache
#
# The agent under test is any OpenAI-compatible endpoint, configured via .env
# (EVAL_API_BASE_URL, EVAL_MODEL, EVAL_API_KEY). You can also wrap your actual
# agent CLI via an exec provider (see below).

description: Aegis Forge — AI agent rule-compliance evals

# ============================================================================
# HOW TO RUN (verified 2026-09-15):
#
#   Run ONE scenario against the working local provider:
#       npx promptfoo@latest eval -c evals/suites/<name>.yaml --no-cache
#
# The per-scenario configs in evals/suites/ are the source of truth. They use
# the generic `http` provider (NOT `openai:chat`) against an OpenAI-compatible
# endpoint whose URL / model / key are read from .env (EVAL_API_BASE_URL,
# EVAL_MODEL, EVAL_API_KEY). The generic http provider is used because some
# OpenAI-compatible routers return SSE when `stream` is truthy, which
# promptfoo's openai provider cannot parse. See evals/suites/ for the pattern.
#
# TWO GOTCHAS this file originally got wrong (fixed in evals/suites/):
#   1. Top-level `prompts:` + scenario `prompt:` keys were BOTH required; with
#      neither, promptfoo sent `messages: []` → API 400 "messages_required".
#      Prompts now live in evals/prompts/<name>.txt as top-level file:// refs.
#   2. A single config with N prompts × M scenarios produces an N×M CROSS
#      PRODUCT (8 prompts × 8 scenarios = 64 mismatched cases). promptfoo does
#      NOT reliably pair by `label:`. Fix: one config per scenario (suites/),
#      each with exactly 1 prompt + 1 scenario → 8 clean cases.
# ============================================================================

# Provider config is per-scenario in evals/suites/. The endpoint is any
# OpenAI-compatible chat-completions API, configured via .env:
#   EVAL_API_BASE_URL  e.g. https://api.openai.com/v1 (or a local router)
#   EVAL_MODEL         the model id your endpoint serves
#   EVAL_API_KEY       your provider key
# See evals/suites/ for the generic http provider pattern (stream:false).
#
# To run YOUR agent CLI instead of a raw model, use an exec provider, e.g.:
#   - id: exec:python evals/runners/run_agent.py --scenario {{prompt}}
#     label: my-agent-cli

# --- Scenarios (reference only — run via evals/suites/<name>.yaml) ----------
tests:
  - file://scenarios/web-auth-endpoint.yaml
  - file://scenarios/mobile-token-storage.yaml
  - file://scenarios/trading-risk-gate.yaml
  - file://scenarios/api-contract-envelope.yaml
  - file://scenarios/rbac-enforcement.yaml
  - file://scenarios/stride-adr-quality.yaml
  - file://scenarios/prd-interview.yaml
  - file://scenarios/spec-to-tasks.yaml
